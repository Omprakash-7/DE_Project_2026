<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" width="1600" height="1250">
  <defs>
    <!-- Arrow marker for relationships -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Solid Background (Fixes transparency issues in Preview/Finder) -->
  <rect x="0" y="0" width="1600" height="1250" fill="#0f172a"/>

  <!-- Title Banner -->
  <rect x="40" y="20" width="1520" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="800" y="55" fill="#f8fafc" font-size="24" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="0.5">WHATSAPP MESSAGING DATABASE — ENTITY RELATIONSHIP DIAGRAM (CP1)</text>
  <text x="800" y="80" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">Schema: whatsapp  |  Team: T0004  |  Section: D  |  Database: PostgreSQL 15+</text>

  <!-- ================= RELATIONSHIP CONNECTOR LINES ================= -->
  <!-- USERS to DEVICES (1:N) -->
  <line x1="320" y1="240" x2="480" y2="240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="375" y="228" width="50" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="243" fill="#38bdf8" font-size="11" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1 : N</text>

  <!-- USERS to CHATS (1:N created_by) -->
  <line x1="220" y1="450" x2="220" y2="560" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="160" y="490" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="220" y="505" fill="#38bdf8" font-size="11" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1:N (created_by)</text>

  <!-- USERS to CHAT_MEMBERS (1:N) -->
  <path d="M 320 360 L 520 450" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="400" y="390" fill="#34d399" font-size="11" font-family="Arial, sans-serif" font-weight="bold">1 : N</text>

  <!-- CHATS to CHAT_MEMBERS (1:N) -->
  <path d="M 320 660 L 520 520" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="400" y="615" fill="#34d399" font-size="11" font-family="Arial, sans-serif" font-weight="bold">1 : N</text>

  <!-- CHATS to MESSAGES (1:N) -->
  <line x1="320" y1="700" x2="800" y2="700" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="540" y="688" width="50" height="22" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="565" y="703" fill="#a78bfa" font-size="11" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1 : N</text>

  <!-- USERS to MESSAGES (1:N sender_id) -->
  <path d="M 320 400 Q 560 620 800 640" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="500" y="580" width="110" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="555" y="595" fill="#38bdf8" font-size="11" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1:N (sender_id)</text>

  <!-- USERS to MEDIA (1:N uploader_id) -->
  <path d="M 180 450 L 180 960 L 480 960" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="260" y="948" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="320" y="963" fill="#38bdf8" font-size="11" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1:N (uploader_id)</text>

  <!-- MEDIA to MESSAGES (1:0..1 media_id) -->
  <path d="M 720 960 L 920 960 L 920 910" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="780" y="948" width="100" height="22" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="830" y="963" fill="#f59e0b" font-size="11" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1 : 0..1</text>

  <!-- MESSAGES to MESSAGE_RECEIPTS (1:N) -->
  <line x1="1080" y1="700" x2="1200" y2="700" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="1125" y="688" width="50" height="22" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="1150" y="703" fill="#a78bfa" font-size="11" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1 : N</text>

  <!-- MESSAGES self-reference (replies) -->
  <path d="M 1080 620 C 1140 620 1140 660 1080 660" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="1145" y="645" fill="#a78bfa" font-size="10" font-family="Arial, sans-serif" font-weight="bold">reply_to</text>

  <!-- USERS to CALLS (1:N caller_id) -->
  <path d="M 260 450 Q 700 1100 1200 1020" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="680" y="1035" width="110" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="735" y="1050" fill="#38bdf8" font-size="11" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1:N (caller_id)</text>

  <!-- ================= ENTITY TABLES ================= -->

  <!-- TABLE 1: USERS -->
  <g>
    <rect x="70" y="130" width="250" height="320" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="70" y="130" width="250" height="36" rx="6" fill="#1d4ed8"/>
    <text x="195" y="155" fill="#ffffff" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">users</text>
    <text x="85" y="190" fill="#38bdf8" font-size="12" font-family="monospace">PK user_id        : INT</text>
    <text x="85" y="215" fill="#facc15" font-size="12" font-family="monospace">UQ phone_e164     : VARCHAR(16)</text>
    <text x="85" y="240" fill="#f1f5f9" font-size="12" font-family="monospace">   display_name   : VARCHAR(100)</text>
    <text x="85" y="265" fill="#94a3b8" font-size="12" font-family="monospace">   about          : TEXT</text>
    <text x="85" y="290" fill="#f1f5f9" font-size="12" font-family="monospace">   is_business    : BOOLEAN</text>
    <text x="85" y="315" fill="#f1f5f9" font-size="12" font-family="monospace">   joined_on      : DATE</text>
    <text x="85" y="340" fill="#94a3b8" font-size="12" font-family="monospace">   last_seen_at   : TIMESTAMPTZ</text>
    <text x="85" y="365" fill="#f1f5f9" font-size="12" font-family="monospace">   status         : VARCHAR(10)</text>
    <text x="85" y="400" fill="#64748b" font-size="11" font-family="Arial, sans-serif">30,000 rows | 3 CHECKs</text>
  </g>

  <!-- TABLE 2: DEVICES -->
  <g>
    <rect x="480" y="130" width="240" height="240" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="480" y="130" width="240" height="36" rx="6" fill="#1d4ed8"/>
    <text x="600" y="155" fill="#ffffff" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">devices</text>
    <text x="495" y="190" fill="#38bdf8" font-size="12" font-family="monospace">PK device_id      : INT</text>
    <text x="495" y="215" fill="#f43f5e" font-size="12" font-family="monospace">FK user_id        : INT</text>
    <text x="495" y="240" fill="#f1f5f9" font-size="12" font-family="monospace">   device_type    : VARCHAR(10)</text>
    <text x="495" y="265" fill="#f1f5f9" font-size="12" font-family="monospace">   app_version    : VARCHAR(20)</text>
    <text x="495" y="290" fill="#f1f5f9" font-size="12" font-family="monospace">   registered_at  : TIMESTAMPTZ</text>
    <text x="495" y="315" fill="#f1f5f9" font-size="12" font-family="monospace">   last_active_at : TIMESTAMPTZ</text>
    <text x="495" y="345" fill="#64748b" font-size="11" font-family="Arial, sans-serif">42,000 rows | ON DELETE CASCADE</text>
  </g>

  <!-- TABLE 3: CHATS -->
  <g>
    <rect x="70" y="560" width="250" height="230" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="70" y="560" width="250" height="36" rx="6" fill="#1d4ed8"/>
    <text x="195" y="585" fill="#ffffff" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">chats</text>
    <text x="85" y="620" fill="#38bdf8" font-size="12" font-family="monospace">PK chat_id        : INT</text>
    <text x="85" y="645" fill="#f1f5f9" font-size="12" font-family="monospace">   chat_type      : VARCHAR(10)</text>
    <text x="85" y="670" fill="#94a3b8" font-size="12" font-family="monospace">   group_name     : VARCHAR(100)</text>
    <text x="85" y="695" fill="#f43f5e" font-size="12" font-family="monospace">FK created_by     : INT</text>
    <text x="85" y="720" fill="#f1f5f9" font-size="12" font-family="monospace">   created_at     : TIMESTAMPTZ</text>
    <text x="85" y="755" fill="#64748b" font-size="11" font-family="Arial, sans-serif">23,000 rows | ON DELETE RESTRICT</text>
  </g>

  <!-- TABLE 4: CHAT_MEMBERS -->
  <g>
    <rect x="520" y="410" width="240" height="240" rx="6" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <rect x="520" y="410" width="240" height="36" rx="6" fill="#047857"/>
    <text x="640" y="435" fill="#ffffff" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">chat_members</text>
    <text x="535" y="470" fill="#38bdf8" font-size="12" font-family="monospace">PK,FK chat_id     : INT</text>
    <text x="535" y="495" fill="#38bdf8" font-size="12" font-family="monospace">PK,FK user_id     : INT</text>
    <text x="535" y="520" fill="#f1f5f9" font-size="12" font-family="monospace">      role        : VARCHAR(10)</text>
    <text x="535" y="545" fill="#f1f5f9" font-size="12" font-family="monospace">      joined_at   : TIMESTAMPTZ</text>
    <text x="535" y="570" fill="#94a3b8" font-size="12" font-family="monospace">      left_at     : TIMESTAMPTZ</text>
    <text x="535" y="595" fill="#f1f5f9" font-size="12" font-family="monospace">      is_muted    : BOOLEAN</text>
    <text x="535" y="625" fill="#64748b" font-size="11" font-family="Arial, sans-serif">104,514 rows | M:N Junction</text>
  </g>

  <!-- TABLE 5: MEDIA -->
  <g>
    <rect x="480" y="860" width="240" height="260" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="480" y="860" width="240" height="36" rx="6" fill="#1d4ed8"/>
    <text x="600" y="885" fill="#ffffff" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">media</text>
    <text x="495" y="920" fill="#38bdf8" font-size="12" font-family="monospace">PK media_id       : INT</text>
    <text x="495" y="945" fill="#f43f5e" font-size="12" font-family="monospace">FK uploader_id    : INT</text>
    <text x="495" y="970" fill="#f1f5f9" font-size="12" font-family="monospace">   media_type     : VARCHAR(10)</text>
    <text x="495" y="995" fill="#f1f5f9" font-size="12" font-family="monospace">   mime_type      : VARCHAR(50)</text>
    <text x="495" y="1020" fill="#f1f5f9" font-size="12" font-family="monospace">   size_bytes     : BIGINT</text>
    <text x="495" y="1045" fill="#facc15" font-size="12" font-family="monospace">   sha256         : CHAR(64)</text>
    <text x="495" y="1070" fill="#f1f5f9" font-size="12" font-family="monospace">   uploaded_at    : TIMESTAMPTZ</text>
    <text x="495" y="1095" fill="#64748b" font-size="11" font-family="Arial, sans-serif">27,634 rows | NOT UNIQUE sha256</text>
  </g>

  <!-- TABLE 6: MESSAGES -->
  <g>
    <rect x="800" y="520" width="280" height="390" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="800" y="520" width="280" height="36" rx="6" fill="#6d28d9"/>
    <text x="940" y="545" fill="#ffffff" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">messages</text>
    <text x="815" y="580" fill="#38bdf8" font-size="12" font-family="monospace">PK message_id    : BIGINT</text>
    <text x="815" y="605" fill="#f43f5e" font-size="12" font-family="monospace">FK chat_id       : INT</text>
    <text x="815" y="630" fill="#f43f5e" font-size="12" font-family="monospace">FK sender_id     : INT</text>
    <text x="815" y="655" fill="#f1f5f9" font-size="12" font-family="monospace">   sent_at       : TIMESTAMPTZ</text>
    <text x="815" y="680" fill="#f1f5f9" font-size="12" font-family="monospace">   message_type  : VARCHAR(10)</text>
    <text x="815" y="705" fill="#94a3b8" font-size="12" font-family="monospace">   body          : TEXT</text>
    <text x="815" y="730" fill="#f43f5e" font-size="12" font-family="monospace">FK media_id      : INT (NULLABLE)</text>
    <text x="815" y="755" fill="#f43f5e" font-size="12" font-family="monospace">FK reply_to_id   : BIGINT</text>
    <text x="815" y="780" fill="#f1f5f9" font-size="12" font-family="monospace">   is_forwarded  : BOOLEAN</text>
    <text x="815" y="805" fill="#f1f5f9" font-size="12" font-family="monospace">   is_deleted    : BOOLEAN</text>
    <text x="815" y="830" fill="#94a3b8" font-size="12" font-family="monospace">   edited_at     : TIMESTAMPTZ</text>
    <text x="815" y="870" fill="#64748b" font-size="11" font-family="Arial, sans-serif">120,000 rows | Delete-for-everyone logic</text>
  </g>

  <!-- TABLE 7: MESSAGE_RECEIPTS -->
  <g>
    <rect x="1200" y="580" width="240" height="200" rx="6" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <rect x="1200" y="580" width="240" height="36" rx="6" fill="#047857"/>
    <text x="1320" y="605" fill="#ffffff" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">message_receipts</text>
    <text x="1215" y="640" fill="#38bdf8" font-size="12" font-family="monospace">PK,FK message_id : BIGINT</text>
    <text x="1215" y="665" fill="#38bdf8" font-size="12" font-family="monospace">PK,FK user_id    : INT</text>
    <text x="1215" y="690" fill="#94a3b8" font-size="12" font-family="monospace">      delivered_at : TIMESTAMPTZ</text>
    <text x="1215" y="715" fill="#94a3b8" font-size="12" font-family="monospace">      read_at      : TIMESTAMPTZ</text>
    <text x="1215" y="750" fill="#64748b" font-size="11" font-family="Arial, sans-serif">501,590 rows | read >= delivered</text>
  </g>

  <!-- TABLE 8: CALLS -->
  <g>
    <rect x="1200" y="860" width="240" height="260" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="1200" y="860" width="240" height="36" rx="6" fill="#1d4ed8"/>
    <text x="1320" y="885" fill="#ffffff" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">calls</text>
    <text x="1215" y="920" fill="#38bdf8" font-size="12" font-family="monospace">PK call_id       : INT</text>
    <text x="1215" y="945" fill="#f43f5e" font-size="12" font-family="monospace">FK chat_id       : INT</text>
    <text x="1215" y="970" fill="#f43f5e" font-size="12" font-family="monospace">FK caller_id     : INT</text>
    <text x="1215" y="995" fill="#f1f5f9" font-size="12" font-family="monospace">   call_type     : VARCHAR(10)</text>
    <text x="1215" y="1020" fill="#f1f5f9" font-size="12" font-family="monospace">   started_at    : TIMESTAMPTZ</text>
    <text x="1215" y="1045" fill="#94a3b8" font-size="12" font-family="monospace">   answered_at   : TIMESTAMPTZ</text>
    <text x="1215" y="1070" fill="#94a3b8" font-size="12" font-family="monospace">   ended_at      : TIMESTAMPTZ</text>
    <text x="1215" y="1095" fill="#f1f5f9" font-size="12" font-family="monospace">   status        : VARCHAR(15)</text>
  </g>

  <!-- TABLE 9: BLOCKED_USERS -->
  <g>
    <rect x="70" y="860" width="250" height="180" rx="6" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <rect x="70" y="860" width="250" height="36" rx="6" fill="#047857"/>
    <text x="195" y="885" fill="#ffffff" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">blocked_users</text>
    <text x="85" y="920" fill="#38bdf8" font-size="12" font-family="monospace">PK,FK blocker_id : INT</text>
    <text x="85" y="945" fill="#38bdf8" font-size="12" font-family="monospace">PK,FK blocked_id : INT</text>
    <text x="85" y="970" fill="#f1f5f9" font-size="12" font-family="monospace">      blocked_at : TIMESTAMPTZ</text>
    <text x="85" y="1005" fill="#64748b" font-size="11" font-family="Arial, sans-serif">4,000 rows | blocker != blocked</text>
  </g>
</svg>
